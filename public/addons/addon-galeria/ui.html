<div class="addon-galeria-ui">

  <div class="node-row">
    <button type="button" id="root-folder-btn" name="root-folder" class="custom-folder-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      {1}
    </button>
  </div>

  <div class="node-row folder-path-row">
    <span name="root-path" class="folder-path-label" data-empty-text="{13}" title="">{13}</span>
  </div>

  <div class="node-row field-row">
    <label class="field-label" for="character-input">{5}</label>
    <input
      id="character-input"
      type="search"
      name="character"
      list="gallery-characters-list"
      placeholder="{15}"
      autocomplete="off"
    />
    <datalist id="gallery-characters-list"></datalist>
  </div>

  <div class="node-row field-row">
    <label class="field-label" for="load-source-select">{6}</label>
    <select id="load-source-select" name="loadSource">
      <option value="particles">{17}</option>
      <option value="base">{18}</option>
      <option value="path">{19}</option>
    </select>
  </div>

  <div class="node-row path-slot-row" name="path-slot-row" hidden>
    <div class="slot-label path-slot-label">
      {slot:path}<span>{19}</span>{/slot}
    </div>
  </div>

  <div class="node-row folder-path-row">
    <span class="path-label-caption">{14}</span>
    <span name="active-path" class="folder-path-label" data-empty-text="{14}" title="">{14}</span>
  </div>

  <div class="node-row input-row">
    <div class="slot-label">
      {slot:index}<span>{2}</span>{/slot}
    </div>
    <input id="index-input" type="number" name="index" placeholder="0" value="0" min="0" />
  </div>

  <span name="loading-text" hidden aria-hidden="true">{9}</span>

  {cotexMenu:img}
  <div class="slider-container">
    <img name="image-display" src="" alt="Galeria" style="display: none;" />
    <span name="no-image-text" data-empty-text="{4}">{4}</span>
    <div name="loading-panel" class="gallery-loading-panel" hidden>
      <span name="loading-label" class="gallery-loading-label">{9}</span>
      <div class="gallery-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div name="loading-progress" class="gallery-progress-fill"></div>
      </div>
    </div>
  </div>
  {/cotexMenu}

  <div class="node-row output-row">
    <div class="slot-label right">
      {slot:currentImage}<span>{3}</span>{/slot}
    </div>
  </div>

</div>
