name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node-graphs-lol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify
        run: npm install && npm run build && npm run test
